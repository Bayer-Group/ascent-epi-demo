[build-system]
requires = ["setuptools>=70.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ascent-medical-coder"
version = "0.1.0"
description = "Transform free-form clinical queries into curated medical concept lists (Qdrant + OMOP vocabulary + LLM post-processing)."
# Python 3.12 only. Upper bound below explains itself; the image runs
# python:3.12-slim. Pinned numpy==1.26.4 has no 3.13 wheels, and
# qdrant-client==1.16.1 requires numpy>=2.1.0 on 3.13.
requires-python = ">=3.12,<3.13"
dependencies = [
    # ---------- Data & ML ----------
    "sentence-transformers==2.7.0",
    "torch==2.8.0",
    "pandas==2.2.3",
    "numpy==1.26.4",
    "pyarrow==23.0.1",   # CVE-2026-25087 (IPC use-after-free)

    # ---------- Search / Vector ----------
    "qdrant-client==1.16.1",

    # ---------- Warehouse ----------
    # DuckDB over the shipped vocabulary replaces the Snowflake driver;
    # sqlglot translates the pipeline's Snowflake-dialect SQL.
    "duckdb>=1.1",
    "sqlglot>=25",
    # Pinned, not imported directly: cryptography 47.0.0+ arm64 wheels SIGILL
    # under Apple Virtualization.framework (local Docker on Apple Silicon).
    # The 46.x line runs natively on both arm64 (local) and amd64 (deploy).
    "cryptography>=46.0.5,<47",

    # ---------- LLM / AI ----------
    "openai==1.93.2",
    "google-genai==1.56.0",

    # ---------- Web / API ----------
    "fastapi==0.115.14",       # starlette>=0.40 (CVE-2024-47874 DoS)
    "uvicorn[standard]==0.29.0",
    "gunicorn==22.0.0",        # documented production entrypoint (Dockerfile note)
    "pydantic==2.12.5",
    "pydantic-settings==2.7.1",  # typed settings (replaces the flat config.py module)
    "fastapi-azure-auth==4.3.1",
    "PyJWT[crypto]==2.12.0",   # CVE-2026-32597 (unknown crit header)
    "requests==2.33.0",

    # ---------- Database / Cache ----------
    "SQLAlchemy==2.0.29",
    "asyncpg~=0.29",
    "boto3==1.34.97",
    "botocore==1.34.97",

    # ---------- Utilities ----------
    "python-dotenv==1.2.2",
    "urllib3==2.7.0",   # CVE-2026-44431/44432 (decompression-bomb bypass)
    "setuptools==80.9.0",   # required so llama-index>=0.13 can install
    "tenacity==8.2.3",
    "rapidfuzz~=3.14.1",
    "pyinstrument~=5.0.0",

]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-mock==3.14.0",
    "pytest-asyncio==0.24.0",
    "ruff==0.9.6",
]


# The embedders run on CPU by design -- that is what removes the GPU
# dependency the concept index would otherwise need. Without this, torch
# resolves from PyPI and drags ~3 GB of CUDA wheels into every x86_64 image
# (they are marker-gated to linux/x86_64, so an arm64 build looks fine and CI
# does not).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes (unused imports/vars, undefined names)
    "I",        # isort (import ordering)
    "UP",       # pyupgrade (modern syntax)
    "B",        # flake8-bugbear
    "SIM",      # flake8-simplify
    "C4",       # comprehensions
    "TID",      # tidy imports
    "RUF",      # ruff-specific
]
ignore = [
    "E501",     # line length handled by the formatter
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
