[build-system]
requires = ["setuptools>=84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ascent-medical-coder"
version = "0.1.0"
description = "Transform free-form clinical queries into curated medical concept lists (Qdrant + OMOP vocabulary + LLM post-processing)."
# Python 3.12 only. Upper bound below explains itself; the image runs
# python:3.12-slim. Pinned numpy==1.26.4 has no 3.13 wheels, and
# qdrant-client==1.16.1 requires numpy>=2.1.0 on 3.13.
requires-python = ">=3.12,<3.13"
dependencies = [
    # ---------- Data & ML ----------
    "sentence-transformers>=5.6.0",
    "torch>=2.13.0",
    "pandas==2.2.3",
    "numpy>=2.2",
    "pyarrow>=23.0.1",   # CVE-2026-25087 (IPC use-after-free)

    # ---------- Search / Vector ----------
    "qdrant-client==1.20.0",

    # ---------- Warehouse ----------
    # DuckDB over the shipped vocabulary replaces the Snowflake driver;
    # sqlglot translates the pipeline's Snowflake-dialect SQL.
    "duckdb>=1.1",
    "sqlglot>=25",
    # Floor, not imported directly. Raised to 50.0.0 for open security advisories;
    # older releases were held back for an Apple Silicon Docker issue (47.0.0+
    # arm64 wheels SIGILL under Apple Virtualization.framework).
    "cryptography>=50.0.0",

    # ---------- LLM / AI ----------
    "openai==1.93.2",
    "google-genai==1.56.0",

    # ---------- Web / API ----------
    "fastapi>=0.125.0",        # pulls starlette>=1.3.1 (open starlette advisories)
    "uvicorn[standard]==0.54.0",
    "gunicorn==27.0.1",        # documented production entrypoint (Dockerfile note)
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",  # typed settings (replaces the flat config.py module)
    "fastapi-azure-auth>=5.0.1",  # 5.x uses PyJWT; 4.x pulled python-jose + ecdsa (no fix available)
    "PyJWT[crypto]>=2.15.0",
    "requests>=2.33.0",

    # ---------- Database / Cache ----------
    "SQLAlchemy==2.0.29",
    "asyncpg~=0.29",
    "boto3==1.34.97",
    "botocore==1.34.97",

    # ---------- Utilities ----------
    "python-dotenv==1.2.4",
    "urllib3>=2.8.0",
    "setuptools>=84.1.0",
    "tenacity==8.2.3",
    "rapidfuzz~=3.14.1",
    "pyinstrument>=5.0,<5.2",

]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-mock>=3.14.0",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.9.6",
]


# The embedders run on CPU by design -- that is what removes the GPU
# dependency the concept index would otherwise need. Without this, torch
# resolves from PyPI and drags ~3 GB of CUDA wheels into every x86_64 image
# (they are marker-gated to linux/x86_64, so an arm64 build looks fine and CI
# does not).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes (unused imports/vars, undefined names)
    "I",        # isort (import ordering)
    "UP",       # pyupgrade (modern syntax)
    "B",        # flake8-bugbear
    "SIM",      # flake8-simplify
    "C4",       # comprehensions
    "TID",      # tidy imports
    "RUF",      # ruff-specific
]
ignore = [
    "E501",     # line length handled by the formatter
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# Security floors for transitive dependencies. Each floor is the first release
# that fixes the open advisories for that package (GitHub Advisory Database).
[tool.uv]
constraint-dependencies = [
    "certifi>=2026.10.18",
    "filelock>=4.2.1",
    "pillow>=13.0.0",
    "pyasn1>=0.6.5",
    "starlette>=1.3.1",
    "transformers>=5.10.0",
    "urllib3>=2.8.0",
]
