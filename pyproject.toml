[project]
# Must match uv.lock, which records the project by name and version: renaming
# here without re-locking makes `uv sync --frozen` fail to match the workspace
# member, and the whole point of the committed lock is that a build does not
# re-resolve. The repository name is what identifies this publicly; nothing
# publishes this package to an index.
name = "ascent"
version = "0.0.0"
description = "An epidemiology question-answering demo over synthetic OMOP and non-OMOP data, served as an MCP server"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
keywords = ["omop", "non-omop", "epidemiology", "mcp", "healthcare", "synthetic-data"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    # No "License :: OSI Approved :: ..." classifier: PEP 639 superseded those
    # by the `license` expression above, and setuptools errors out if both are
    # present.
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# Core dependencies
#   python -m pip install .
#   uv --sync
dependencies = [
    # Imported directly by src/, so declared here rather than relied on
    # transitively (anyio via httpx/mcp, botocore via boto3, jwt via
    # fastmcp/msal, langchain_core via langgraph): a transitive arrival
    # becomes an ImportError the moment an upstream drops it.
    #
    # duckdb and sqlglot are the proof of that. Both reached the environment
    # only through phenex -> ibis-framework; when phenex went, so did they, and
    # the warehouse imports both directly -- session.py opens the DuckDB
    # connection and transpiles Snowflake SQL to the DuckDB dialect.
    "anyio>=4.13.0",
    "botocore>=1.42.85",
    # Pinned to the versions the tree was already resolving through ibis. A
    # dependency removal should not also bump the SQL transpiler the warehouse
    # relies on -- moving them is a separate, testable decision.
    "duckdb==1.1.3",
    "sqlglot==25.20.2",
    "pyjwt>=2.12.1",
    "langchain-core>=1.2.27",
    "aiocache>=0.12.3",
    "aiohttp>=3.11.11",
    "alembic>=1.14.1",
    "apscheduler>=3.11.0",
    "asgi-correlation-id>=4.3.4",
    "asyncpg>=0.30.0",
    "boto3>=1.36.2",
    "fastapi>=0.115.6",
    "fastapi-azure-auth>=5.0.1",
    "greenlet>=3.1.1",
    "numpy>=2.2.2",
    "aws-embedded-metrics",
    "opentelemetry-sdk==1.40.0",
    "opentelemetry-api==1.40.0",
    "opentelemetry-exporter-otlp==1.40.0",
    "opentelemetry-distro==0.61b0",
    "opentelemetry-instrumentation-fastapi==0.61b0",
    "opentelemetry-propagator-aws-xray==1.0.2",
    "opentelemetry-sdk-extension-aws==2.1.0",
    "opentelemetry-instrumentation-sqlalchemy==0.61b0",
    "opentelemetry-instrumentation-botocore==0.61b0",
    "opentelemetry-instrumentation-dbapi==0.61b0",
    "opentelemetry-instrumentation-redis==0.61b0",
    "opentelemetry-instrumentation-requests==0.61b0",
    "opentelemetry-instrumentation-openai-v2==2.3b0",
    "opentelemetry-instrumentation-aiohttp-client==0.61b0",
    "pandas>=2.2.3",
    "pydantic>=2.10.5",
    "pydantic-settings>=2.7.1",
    "python-json-logger>=3.2.1",
    "redis>=5.2.1",
    # >=3.18.1 for CVE-2026-15925: everything below it verifies TLS hostnames
    # improperly. Nothing here connects to Snowflake -- the warehouse is DuckDB --
    # but observability/otel.py imports the driver to instrument it, so the
    # package ships and may as well ship patched.
    "snowflake-connector-python>=3.18.1",
    "sqlalchemy>=2.0.37",
    "hypercorn>=0.17.3",
    "psycopg2-binary>=2.9.10",
    "uvicorn>=0.34.2",
    "sqlparse>=0.6.0",
    "fastmcp[tasks]==3.2.0",
    "key-value[redis]==0.1.2",
    "langchain-google-genai",
    "google-genai>=1.55.0",
    # Anything marked "lazy" below is imported by a library on our behalf at
    # call time rather than by this source directly -- tabulate, for instance,
    # is what pandas needs for DataFrame.to_markdown(). Nothing here does
    # `import tabulate`, so a static scan reads it as unused: keep it, and
    # see tests/seams/test_lazy_optional_dependencies.py.
    "tabulate",                  # lazy: pandas DataFrame.to_markdown()
    "openpyxl",                  # lazy: pandas read_excel() in query_library.py
    "azure-ai-inference",
    "cryptography",
    "google-cloud-aiplatform",   # vertexai
    "httpx",
    "langgraph",
    "matplotlib",                # eager in models/inference/criteria_to_counts.py
    "msal",
    "networkx",
    "openai",
    # Claude direct; the Bedrock path uses boto3 instead.
    "anthropic",
    "python-dotenv",
    "requests",
    "scikit-learn",
    "scipy",
    "sentence-transformers",
    "tenacity",
    "tiktoken",
    "torch",                     # eager in models/uncertainty/uncertainty_kernel_laplacian.py
    "tqdm",
    "transformers",
    "typing-extensions",
]


# Optional dependencies
#   python -m pip install .[dev]
#   uv sync --extra dev
[project.optional-dependencies]
# Imported lazily and unreachable on any request path: seaborn only from the
# guarded uncertainty plots, streamlit only from st.error handlers in
# criteria_to_counts. Install with `uv sync --extra research` if you need them.
#
# gitpython is not imported here at all -- it arrives under streamlit, which
# pins only a lower bound. Named explicitly to hold it past CVE-2026-78676,
# where a dormant multi-line git-config value is corrupted into a live
# directive (core.hooksPath) on an unrelated config write, giving RCE. This
# extra is not installed by default and not in the image, so the alert is the
# main cost -- but a floor is cheaper than explaining that every time.
research = ["seaborn", "streamlit", "gitpython>=3.1.59"]

# Tools useful during development
dev = [
    "locust>=2.32.6",
    "pre-commit>=4.1.0",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.2",
    "pytest-cov>=6.0.0",
    "pytest-dotenv>=0.5.2",
    "ruff>=0.9.2",
    "pyright>=1.1.390",
]

# Tool Configuration
[tool.ruff]
line-length = 150

[tool.ruff.lint]
# Enable Pyflakes and pycodestyle rules
exclude = ["scripts/**/*"]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# The warnings filter above these imports has to run before them to take
# effect, which puts them after a statement.
"src/ascent_platform/llm/clients/assistants.py" = ["E402"]
# Long lines here are prompt text inside triple-quoted strings, where a line
# break is content: reflowing them changes what the model is asked.
"src/ascent_domain/omop/models/uncertainty/disambiguation.py" = ["E501"]
"src/ascent_domain/omop/models/inference/rwd_request.py" = ["E501"]
"src/ascent_domain/non_omop/prompts/prompts_pipeline.py" = ["E501"]
"services/medical-coder/src/ascent_medical_coder/prompts/prompts_llm_filter.py" = ["E501"]


[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ascent*"]

# PyTorch's default wheels bundle a full CUDA toolchain: nvidia-* (2.8 GB),
# triton (652 MB) and a CUDA-linked torch (914 MB) -- about 4.4 GB of a 6.7 GB
# image. Nothing here can use it. The stack has no GPU, torch.cuda.is_available()
# is False, and the only torch workloads are embedding a 5,255-concept
# vocabulary and the query library, both of which run on CPU in seconds.
#
# Pinning torch to the CPU index drops the CUDA packages entirely. Keep this
# if you are running on a GPU host and want acceleration -- remove the two
# blocks below and re-lock.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pyright]
include = ["src"]
exclude = ["**/__pycache__"]
typeCheckingMode = "basic"
